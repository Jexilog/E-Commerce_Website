<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/sign_in.css">
    <title>Document</title>
</head>
<body>
    <main>

        <div class="img">
            <img src="assets/img/signin_img.png" alt="">
        </div>

        <div class="container">
            <div class="title"><h1>Welcome Back</h1></div>
            <div class="text"><p>Please login to your account</p></div>

            <form action="" method="post">
                <div class="email"><input type="email" placeholder="Email address"></div>
                <div class="pass"><input type="password" placeholder="********"></div>
            </form>

            <div class="check_box">
                <div><input type="checkbox"> Remember me</div>
                <a href="">forgot password?</a>
            </div>
            <div class="login_btn"><button type="submit"><h2>Login</h2></button></div>
            <div class="sign_up_link"><p>Don't have an account? <a href="sign_up_page.html">Sign Up</a></p></div>
        </div>

    </main>
</body>
</html>
